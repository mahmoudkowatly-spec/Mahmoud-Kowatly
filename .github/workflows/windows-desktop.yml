name: Windows Desktop Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/windows-desktop-electron
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Verify TypeScript
        run: npx tsc --noEmit
      - name: Run tests
        run: npm test
      - name: Build Windows installer
        run: npm run desktop:pack
      - name: Build Windows portable app
        run: npm run desktop:portable
      - name: Prepare direct-download portable filename
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          $portable = Get-ChildItem -Path release-portable -Filter *.exe | Select-Object -First 1
          if (-not $portable) { throw "Portable EXE was not produced." }
          Copy-Item $portable.FullName "release/BOQ-Pro-Portable.exe" -Force
      - name: Read app version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Upload Windows builds
        uses: actions/upload-artifact@v4
        with:
          name: BOQ-Pro-Windows-Builds
          path: |
            release/*.exe
            release-portable/*.exe
          if-no-files-found: error
      - name: Publish portable EXE release
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: BOQ Pro v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: release/BOQ-Pro-Portable.exe
          fail_on_unmatched_files: true
